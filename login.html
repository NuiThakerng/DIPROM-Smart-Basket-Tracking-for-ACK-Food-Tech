<!DOCTYPE html>
<html lang="th">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <meta name="theme-color"
          content="#0b5cab">

    <title>SMART BASKET TRACKER - Login</title>

    <link rel="stylesheet" href="style.css">
</head>

<body class="login-body">

    <div class="login-container">

        <div class="login-card">

            <div class="login-logo">
                DIPROM
            </div>

            <h1>
                SMART BASKET
            </h1>

            <h2>
                TRACKER
            </h2>

            <p class="login-subtitle">
                By DIPROM
            </p>


            <form id="loginForm">

                <div class="form-group">

                    <label for="employeeId">
                        Employee ID
                    </label>

                    <input
                        type="text"
                        id="employeeId"
                        placeholder="Enter Employee ID"
                        autocomplete="username"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="pin">
                        PIN
                    </label>

                    <input
                        type="password"
                        id="pin"
                        placeholder="Enter PIN"
                        inputmode="numeric"
                        autocomplete="current-password"
                        required
                    >

                </div>


                <button
                    type="submit"
                    class="btn-primary"
                    id="loginButton">

                    Login

                </button>

            </form>


            <div
                id="loginMessage"
                class="message">
            </div>

        </div>

    </div>


    <script src="login.js"></script>

</body>

</html>
